# Temporary: builds gRPC with Swift Package Manager on macOS to check whether
# changes to the spm-*-include symlinks break SPM consumers. Not intended to be
# merged.
name: SPM build check
on: [push]
permissions:
  contents: read
jobs:
  spm-build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the submodules Package.swift compiles
        run: git submodule update --init third_party/re2 third_party/cel-c
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: List Xcode schemes for the package
        run: xcodebuild -list
      - name: Build gRPC-Package for iOS (as in build_one_example.sh)
        run: |
          xcodebuild build -scheme gRPC-Package \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Build the SPM consumer test (test/spm_build) against the public headers
        run: |
          xcodebuild build-for-testing -scheme gRPC-Package \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
